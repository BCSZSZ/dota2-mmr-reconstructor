name: Refresh and deploy league dashboard

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/league-pages.yml"
      - "site/**"
      - "src/dota2_mmr/league_site.py"
      - "pyproject.toml"
      - "uv.lock"
  schedule:
    # 10:00 JST every day (GitHub cron is UTC).
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: league-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Refresh OpenDota league data
        env:
          OPENDOTA_API_KEY: ${{ secrets.OPENDOTA_API_KEY }}
          OPENDOTA_MAX_PAID_CALLS: "250"
        run: >-
          uv run python -m dota2_mmr.league_site
          --league-id 19224
          --output site/data/league.json
          --refresh-recent 5

      - name: Persist refreshed data
        run: |
          if git diff --quiet -- site/data/league.json; then
            echo "League data is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/league.json
          git commit -m "Refresh league dashboard data"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
